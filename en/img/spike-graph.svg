<svg width="100%" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:720px;margin:0 auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#10b981" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="spike-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="540" fill="#141414" rx="12"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e0e0">Spike Theory — Nervous System Activity Graph</text>

  <!-- ===== AXES ===== -->
  <line x1="90" y1="55" x2="90" y2="400" stroke="#333" stroke-width="0.5"/>
  <line x1="90" y1="400" x2="670" y2="400" stroke="#333" stroke-width="0.5"/>

  <!-- Y labels -->
  <text x="78" y="60" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">Activity</text>
  <text x="78" y="90" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">high</text>
  <text x="78" y="250" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">normal</text>
  <text x="78" y="390" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">low</text>

  <!-- Y ticks -->
  <line x1="86" y1="90" x2="90" y2="90" stroke="#333" stroke-width="0.5"/>
  <line x1="86" y1="250" x2="90" y2="250" stroke="#333" stroke-width="0.5"/>
  <line x1="86" y1="390" x2="90" y2="390" stroke="#333" stroke-width="0.5"/>

  <!-- Grid lines -->
  <line x1="90" y1="90" x2="670" y2="90" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="90" y1="390" x2="670" y2="390" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Somnambulism threshold -->
  <line x1="90" y1="310" x2="670" y2="310" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="90" y="312" width="140" height="16" rx="3" fill="#141414"/>
  <text x="96" y="323" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Somnambulism threshold</text>

  <!-- ===== SPIKE FILL ===== -->
  <path d="M140,250 L140,250 L200,250 Q260,250 300,90 Q340,-10 380,100 Q420,200 450,250 Q480,280 540,300 Q580,310 650,320 L650,400 L140,400 Z" fill="url(#spike-fill)"/>

  <!-- ===== MAIN CURVE ===== -->
  <path d="M90,250 L140,250 L200,250 Q260,250 300,90 Q340,-10 380,100 Q420,200 450,250 Q480,280 540,300 Q580,310 650,320" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Baseline -->
  <line x1="90" y1="250" x2="200" y2="250" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="145" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">baseline</text>

  <!-- ===== STAGE 1: NORMAL STATE (odd → top row y=395) ===== -->
  <circle cx="140" cy="250" r="5" fill="#888"/>
  <line x1="140" y1="255" x2="140" y2="395" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="105" y="395" width="70" height="24" rx="12" fill="#2c2c2a" stroke="#555" stroke-width="0.5"/>
  <text x="140" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ccc">1. Normal</text>
  <text x="140" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">awake &amp; alert</text>

  <!-- ===== STAGE 2: FOCUS (even → bottom row y=445) ===== -->
  <circle cx="230" cy="225" r="5" fill="#3b82f6"/>
  <line x1="230" y1="230" x2="230" y2="445" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="195" y="445" width="70" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="230" y="461" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#85b7eb">2. Focus</text>
  <text x="230" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">attention narrows</text>

  <!-- ===== STAGE 3: SPIKE (odd → top row y=395) ===== -->
  <circle cx="300" cy="90" r="6" fill="#ef4444"/>
  <line x1="300" y1="96" x2="300" y2="395" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="300" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">▲ SHOCK PEAK</text>
  <rect x="265" y="395" width="70" height="24" rx="12" fill="#3d1a1a" stroke="#ef4444" stroke-width="0.5"/>
  <text x="300" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f09595">3. Shock</text>
  <text x="300" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">crit. factor stunned</text>

  <!-- ===== STAGE 4: SLEEP COMMAND (even → bottom row y=445) ===== -->
  <circle cx="370" cy="65" r="4" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="370" y1="70" x2="370" y2="445" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="325" y="40" width="90" height="22" rx="6" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1"/>
  <text x="370" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">«SLEEP!»</text>
  <text x="370" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#777">≈ 0.25 sec after peak</text>
  <circle cx="370" cy="65" r="12" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
  <rect x="335" y="445" width="70" height="24" rx="12" fill="#2a1f3d" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="370" y="461" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#a78bfa">4. Command</text>
  <text x="370" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">window is open</text>

  <!-- ===== STAGE 5: BELOW THRESHOLD (odd → top row y=395) ===== -->
  <circle cx="450" cy="250" r="5" fill="#10b981"/>
  <line x1="450" y1="256" x2="450" y2="395" stroke="#10b981" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M420,280 L440,300" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-green)"/>
  <text x="408" y="292" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">drop</text>
  <rect x="415" y="395" width="70" height="24" rx="12" fill="#143d2a" stroke="#10b981" stroke-width="0.5"/>
  <text x="450" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5dc9a5">5. Drop</text>
  <text x="450" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">below threshold</text>

  <!-- ===== STAGE 6: DEEPENING (even → bottom row y=445) ===== -->
  <circle cx="550" cy="305" r="5" fill="#7c3aed"/>
  <line x1="550" y1="310" x2="550" y2="445" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M650,320 Q670,330 670,340" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="332" text-anchor="start" font-family="system-ui, sans-serif" font-size="8" fill="#777">deeper</text>
  <rect x="515" y="445" width="70" height="24" rx="12" fill="#2a1f3d" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="550" y="461" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#a78bfa">6. Deepening</text>
  <text x="550" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#555">trance stabilization</text>

  <!-- ===== X AXIS LABEL ===== -->
  <text x="380" y="508" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">Time →</text>

  <!-- ===== LEGEND (top right) ===== -->
  <rect x="490" y="50" width="195" height="110" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="502" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Legend</text>

  <line x1="502" y1="88" x2="522" y2="88" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="528" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#888">Activity curve</text>

  <line x1="502" y1="106" x2="522" y2="106" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="528" y="110" font-family="system-ui, sans-serif" font-size="10" fill="#888">Somnambulism threshold</text>

  <line x1="502" y1="124" x2="522" y2="124" stroke="#333" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="528" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#888">Process stages (1–6)</text>

  <circle cx="507" cy="143" r="3" fill="#ef4444"/>
  <text x="528" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#888">Shock peak</text>
</svg>

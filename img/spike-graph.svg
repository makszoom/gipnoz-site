<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:680px;margin:0 auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="spike-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="680" height="420" fill="#141414" rx="12"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e0e0">Теория спайка — график активности нервной системы</text>

  <!-- Y axis -->
  <line x1="80" y1="55" x2="80" y2="350" stroke="#333" stroke-width="0.5"/>
  <!-- X axis -->
  <line x1="80" y1="350" x2="630" y2="350" stroke="#333" stroke-width="0.5"/>

  <!-- Y axis labels -->
  <text x="72" y="60" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">Активность</text>
  <text x="72" y="95" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">высокая</text>
  <text x="72" y="225" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">норма</text>
  <text x="72" y="340" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">низкая</text>

  <!-- Y axis ticks -->
  <line x1="76" y1="95" x2="80" y2="95" stroke="#333" stroke-width="0.5"/>
  <line x1="76" y1="225" x2="80" y2="225" stroke="#333" stroke-width="0.5"/>
  <line x1="76" y1="340" x2="80" y2="340" stroke="#333" stroke-width="0.5"/>

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="95" x2="630" y2="95" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="80" y1="340" x2="630" y2="340" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Somnambulism threshold line -->
  <line x1="80" y1="270" x2="630" y2="270" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="635" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">Порог сомнамбулизма</text>

  <!-- Spike area fill -->
  <path d="M120,225 L120,225 L180,225 Q240,225 280,95 Q320,-10 360,100 Q400,190 430,230 L430,350 L120,350 Z" fill="url(#spike-fill)"/>

  <!-- Main curve -->
  <path d="M80,225 L120,225 L180,225 Q240,225 280,95 Q320,-10 360,100 Q400,190 430,230 Q460,260 520,280 Q560,290 620,300" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>

  <!-- Baseline line -->
  <line x1="80" y1="225" x2="180" y2="225" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="130" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">базовый уровень</text>

  <!-- Stage markers (vertical dashed + labels) -->

  <!-- Stage 1: Normal -->
  <circle cx="130" cy="225" r="4" fill="#888"/>
  <text x="130" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888"><tspan x="130" dy="-2">1. Обычное</tspan><tspan x="130" dy="14">состояние</tspan></text>

  <!-- Stage 2: Focus -->
  <circle cx="230" cy="205" r="4" fill="#3b82f6"/>
  <line x1="230" y1="209" x2="230" y2="350" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="230" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6"><tspan x="230" dy="-2">2. Фокус /</tspan><tspan x="230" dy="14">отвлечение</tspan></text>

  <!-- Stage 3: Spike -->
  <circle cx="280" cy="95" r="5" fill="#ef4444"/>
  <line x1="280" y1="100" x2="280" y2="350" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="280" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">▲ пик шока</text>
  <text x="280" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444"><tspan x="280" dy="-2">3. Шок /</tspan><tspan x="280" dy="14">удивление</tspan></text>

  <!-- Stage 4: Sleep command -->
  <circle cx="340" cy="70" r="3" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="340" y1="75" x2="340" y2="350" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Sleep command label -->
  <rect x="305" y="46" width="70" height="20" rx="4" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="340" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">«СПИ!»</text>
  <text x="340" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed"><tspan x="340" dy="-2">4. Команда</tspan><tspan x="340" dy="14">в спаде</tspan></text>

  <!-- Stage 5: Below threshold -->
  <circle cx="430" cy="230" r="4" fill="#10b981"/>
  <line x1="430" y1="234" x2="430" y2="350" stroke="#10b981" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Arrow crossing the threshold -->
  <path d="M400,245 L420,265" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="370" y="258" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">провал</text>
  <text x="430" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10b981"><tspan x="430" dy="-2">5. Провал</tspan><tspan x="430" dy="14">под порог</tspan></text>

  <!-- Stage 6: Deepening -->
  <circle cx="560" cy="290" r="4" fill="#7c3aed"/>
  <line x1="560" y1="294" x2="560" y2="350" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="560" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed"><tspan x="560" dy="-2">6. Углубление</tspan><tspan x="560" dy="14">(удержание)</tspan></text>

  <!-- Arrow indicating continuing drop -->
  <path d="M620,300 Q640,310 640,320" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- X axis label -->
  <text x="355" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">Время →</text>

  <!-- Legend -->
  <rect x="440" y="60" width="170" height="100" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="450" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Обозначения</text>
  <circle cx="456" cy="94" r="3" fill="#7c3aed"/>
  <text x="464" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#888">Кривая активности</text>
  <line x1="450" y1="112" x2="466" y2="112" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="470" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#888">Порог сомнамбулизма</text>
  <circle cx="456" cy="130" r="3" fill="#ef4444"/>
  <text x="464" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#888">Пик шока</text>
  <line x1="450" y1="148" x2="462" y2="148" stroke="#333" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="467" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#888">Фазы процесса</text>
</svg>

<svg width="100%" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:720px;margin:0 auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#10b981" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="spike-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="520" fill="#141414" rx="12"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e0e0">Теория спайка — график активности нервной системы</text>

  <!-- ===== AXES ===== -->
  <line x1="90" y1="55" x2="90" y2="400" stroke="#333" stroke-width="0.5"/>
  <line x1="90" y1="400" x2="670" y2="400" stroke="#333" stroke-width="0.5"/>

  <!-- Y labels -->
  <text x="78" y="60" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">Активность</text>
  <text x="78" y="90" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">высокая</text>
  <text x="78" y="250" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">норма</text>
  <text x="78" y="390" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#888">низкая</text>

  <!-- Y ticks -->
  <line x1="86" y1="90" x2="90" y2="90" stroke="#333" stroke-width="0.5"/>
  <line x1="86" y1="250" x2="90" y2="250" stroke="#333" stroke-width="0.5"/>
  <line x1="86" y1="390" x2="90" y2="390" stroke="#333" stroke-width="0.5"/>

  <!-- Grid lines -->
  <line x1="90" y1="90" x2="670" y2="90" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="90" y1="390" x2="670" y2="390" stroke="#222" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Somnambulism threshold -->
  <line x1="90" y1="310" x2="670" y2="310" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="90" y="312" width="132" height="16" rx="3" fill="#141414"/>
  <text x="96" y="323" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Порог сомнамбулизма</text>

  <!-- ===== SPIKE FILL ===== -->
  <path d="M140,250 L140,250 L200,250 Q260,250 300,90 Q340,-10 380,100 Q420,200 450,250 Q480,280 540,300 Q580,310 650,320 L650,400 L140,400 Z" fill="url(#spike-fill)"/>

  <!-- ===== MAIN CURVE ===== -->
  <path d="M90,250 L140,250 L200,250 Q260,250 300,90 Q340,-10 380,100 Q420,200 450,250 Q480,280 540,300 Q580,310 650,320" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Baseline -->
  <line x1="90" y1="250" x2="200" y2="250" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="145" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">базовый уровень</text>

  <!-- ===== STAGE 1: NORMAL STATE ===== -->
  <circle cx="140" cy="250" r="5" fill="#888"/>
  <line x1="140" y1="255" x2="140" y2="400" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Stage badge -->
  <rect x="105" y="408" width="70" height="28" rx="14" fill="#2c2c2a" stroke="#555" stroke-width="0.5"/>
  <text x="140" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ccc">1. Обычное</text>
  <!-- Detail callout -->
  <text x="140" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">человек бодр,</text>
  <text x="140" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">внимание рассеяно</text>

  <!-- ===== STAGE 2: FOCUS ===== -->
  <circle cx="250" cy="230" r="5" fill="#3b82f6"/>
  <line x1="250" y1="235" x2="250" y2="400" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="215" y="408" width="70" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="250" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#85b7eb">2. Фокус</text>
  <text x="250" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">внимание сужается</text>
  <text x="250" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">на действии</text>

  <!-- ===== STAGE 3: SHOCK SPIKE ===== -->
  <circle cx="300" cy="90" r="6" fill="#ef4444"/>
  <line x1="300" y1="96" x2="300" y2="400" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Spike annotation -->
  <text x="300" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">▲ ПИК ШОКА</text>
  <rect x="265" y="408" width="70" height="28" rx="14" fill="#3d1a1a" stroke="#ef4444" stroke-width="0.5"/>
  <text x="300" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f09595">3. Шок</text>
  <text x="300" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">критический фактор</text>
  <text x="300" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">временно оглушён</text>

  <!-- ===== STAGE 4: SLEEP COMMAND (in the dip) ===== -->
  <circle cx="365" cy="65" r="4" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="365" y1="70" x2="365" y2="400" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Sleep command badge -->
  <rect x="320" y="40" width="90" height="22" rx="6" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1"/>
  <text x="365" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">«СПИ!»</text>
  <!-- Timing note -->
  <text x="365" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#888"><![CDATA[≈ 0.25 сек после пика]]></text>
  <!-- Ring highlight -->
  <circle cx="365" cy="65" r="12" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- Stage badge -->
  <rect x="330" y="408" width="70" height="28" rx="14" fill="#2a1f3d" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="365" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">4. Команда</text>
  <text x="365" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">момент спада,</text>
  <text x="365" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">окно открыто</text>

  <!-- ===== STAGE 5: BELOW THRESHOLD ===== -->
  <circle cx="450" cy="250" r="5" fill="#10b981"/>
  <line x1="450" y1="256" x2="450" y2="400" stroke="#10b981" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Arrow: crossing threshold -->
  <path d="M420,280 L440,300" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-green)"/>
  <text x="408" y="292" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">провал</text>
  <!-- Stage badge -->
  <rect x="415" y="408" width="70" height="28" rx="14" fill="#143d2a" stroke="#10b981" stroke-width="0.5"/>
  <text x="450" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5dc9a5">5. Провал</text>
  <text x="450" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">уровень падает</text>
  <text x="450" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">ниже порога</text>

  <!-- ===== STAGE 6: DEEPENING ===== -->
  <circle cx="550" cy="305" r="5" fill="#7c3aed"/>
  <line x1="550" y1="310" x2="550" y2="400" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Arrow continuing down -->
  <path d="M650,320 Q670,330 670,340" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="332" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" fill="#888">глубже</text>
  <!-- Stage badge -->
  <rect x="515" y="408" width="70" height="28" rx="14" fill="#2a1f3d" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="550" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">6. Углубление</text>
  <text x="550" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">якорение,</text>
  <text x="550" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#666">удержание транса</text>

  <!-- ===== X AXIS LABEL ===== -->
  <text x="380" y="488" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">Время →</text>

  <!-- ===== LEGEND (top right) ===== -->
  <rect x="490" y="50" width="195" height="110" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="502" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Обозначения</text>

  <line x1="502" y1="88" x2="522" y2="88" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="528" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#888">Кривая активности</text>

  <line x1="502" y1="106" x2="522" y2="106" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="528" y="110" font-family="system-ui, sans-serif" font-size="10" fill="#888">Порог сомнамбулизма</text>

  <line x1="502" y1="124" x2="522" y2="124" stroke="#333" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="528" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#888">Фазы процесса (1–6)</text>

  <circle cx="507" cy="143" r="3" fill="#ef4444"/>
  <text x="528" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#888">Пик шока</text>
</svg>
